plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
def configuredRunDirectory = providers.gradleProperty('runDir').getOrElse('run')
def explicitLocalRuntimeDirectory = layout.buildDirectory.dir('local-runtime').get().asFile
def stageExplicitRuntimeJar = { String propertyName, String moduleName ->
    def configuredPath = providers.gradleProperty(propertyName).orNull
    if (configuredPath == null) return null

    def sourceJar = file(configuredPath)
    if (!sourceJar.isFile()) {
        throw new GradleException("-P${propertyName} does not name a readable jar file: ${sourceJar}")
    }
    explicitLocalRuntimeDirectory.mkdirs()
    def stagedJar = new File(explicitLocalRuntimeDirectory, "${moduleName}-1.0.jar")
    java.nio.file.Files.copy(sourceJar.toPath(), stagedJar.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    return "explicit.local:${moduleName}:1.0"
}
def localMcaModule = stageExplicitRuntimeJar('mcaJar', 'minecraft-comes-alive')
def localArchitecturyModule = stageExplicitRuntimeJar('architecturyJar', 'architectury')
def localTownsteadModule = stageExplicitRuntimeJar('townsteadJar', 'townstead')

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets {
    gameTest {
        java.setSrcDirs(['src/gameTest/java'])
        resources.setSrcDirs(['src/gameTest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file(configuredRunDirectory)
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            // Forge 47 reads mixin configs only from a jar's MixinConfigs manifest attribute (below), which a dev
            // run built from source sets does not have. Without this the Recruits hooks never apply in dev.
            args '-mixin.config=mcakingdoms.mixins.json'
        }

        client {
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gameTest
                }
            }
        }

        data {
            workingDirectory project.file(providers.gradleProperty('dataRunDir').getOrElse('run-data'))
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Townstead's public api.v1, for compat/townstead/v1 only. Townstead publishes no API artifact, so libs/townstead-api holds
// the api/v1 package compiled from the source of the release tag (townstead_api_source_commit) under the official names
// this project builds with, pinned by SHA-256; verifyTownsteadApi refuses the build the moment it is swapped.
// buildTownsteadApi -PtownsteadApiSources=<checkout at that commit> regenerates it. It is compile-only: never shipped, never
// on a run classpath, and at runtime the classes come from the installed Townstead (the backend is loaded only then).
// `townsteadPublished` is the published mod jar itself, raw, for TownsteadApiContractTest, which checks that every
// Townstead member this mod links against exists in the released artifact with the same descriptor.
ext.townsteadApiJar = file("libs/townstead-api/townstead-api-${townstead_api_version}-v1.jar")
configurations.create('townsteadPublished') {
    canBeConsumed = false
    transitive = false
}

repositories {
    if (localMcaModule != null || localArchitecturyModule != null || localTownsteadModule != null) {
        flatDir {
            name = 'ExplicitLocalRuntime'
            dirs explicitLocalRuntimeDirectory
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MCA is opt-in for compatibility runs. Prefer the exact pack jar with
    // -PmcaJar=/absolute/path/to/mca.jar; -PwithMcaRuntime=true resolves the declared version.
    // Neither path leaks MCA into the compile classpath or the public API artifact.
    if (localMcaModule != null) {
        runtimeOnly fg.deobf(localMcaModule)
    } else if (project.findProperty('withMcaRuntime')?.toBoolean()) {
        runtimeOnly fg.deobf("maven.modrinth:minecraft-comes-alive-reborn:${mca_version}")
    }
    if (localArchitecturyModule != null) {
        runtimeOnly fg.deobf(localArchitecturyModule)
    }
    if (localTownsteadModule != null) {
        runtimeOnly fg.deobf(localTownsteadModule)
    }

    compileOnly files(townsteadApiJar)
    testImplementation files(townsteadApiJar)
    townsteadPublished "maven.modrinth:townstead:${townstead_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The GameTest server and the dev runs never see the compile-only Townstead API: without Townstead installed its classes
// must be absent, exactly as in a production pack.
sourceSets.gameTest.runtimeClasspath = sourceSets.gameTest.runtimeClasspath.minus(files(townsteadApiJar))

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    def published = configurations.named('townsteadPublished')
    inputs.files(published)
    doFirst {
        systemProperty 'mcakingdoms.townstead.published', published.get().singleFile.absolutePath
        systemProperty 'mcakingdoms.townstead.publishedSha1', townstead_published_sha1
        systemProperty 'mcakingdoms.townstead.apiJar', townsteadApiJar.absolutePath
        systemProperty 'mcakingdoms.mainClasses', sourceSets.main.output.classesDirs.asPath
    }
}

tasks.register('compileTownsteadApi', JavaCompile) {
    description = 'Compiles Townstead api/v1 from -PtownsteadApiSources=<Townstead checkout at townstead_api_source_commit>.'
    def root = project.findProperty('townsteadApiSources')
    onlyIf { root != null }
    source = root == null ? files() : fileTree("${root}/src/main/java") { include 'com/aetherianartificer/townstead/api/v1/**/*.java' }
    classpath = sourceSets.main.compileClasspath.minus(files(townsteadApiJar))
    destinationDirectory = layout.buildDirectory.dir('townstead-api/classes')
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.register('buildTownsteadApi', Jar) {
    description = 'Regenerates libs/townstead-api from Townstead sources; update townstead_api_jar_sha256 afterwards.'
    dependsOn tasks.named('compileTownsteadApi')
    from tasks.named('compileTownsteadApi').flatMap { it.destinationDirectory }
    destinationDirectory = townsteadApiJar.parentFile
    archiveFileName = townsteadApiJar.name
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyTownsteadApi') {
    description = 'Checks the vendored Townstead api.v1 jar against its pinned SHA-256 and shape.'
    inputs.file(townsteadApiJar)
    inputs.property('sha256', townstead_api_jar_sha256)
    doLast {
        if (!townsteadApiJar.isFile()) {
            throw new GradleException("Townstead api.v1 jar missing at ${townsteadApiJar}; regenerate it with buildTownsteadApi.")
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(townsteadApiJar.bytes).encodeHex().toString()
        if (digest != townstead_api_jar_sha256) {
            throw new GradleException("${townsteadApiJar.name} has SHA-256 ${digest}, not the pinned ${townstead_api_jar_sha256}.")
        }
        def entryPoint = false
        def foreign = []
        new java.util.zip.ZipFile(townsteadApiJar).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.directory || entry.name.startsWith('META-INF/')) return
                if (entry.name == 'com/aetherianartificer/townstead/api/v1/TownsteadApiV1.class') entryPoint = true
                if (!entry.name.startsWith('com/aetherianartificer/townstead/api/v1/') || !entry.name.endsWith('.class')) foreign << entry.name
            }
        }
        if (!entryPoint) throw new GradleException("${townsteadApiJar.name} has no TownsteadApiV1 entry point")
        if (!foreign.isEmpty()) throw new GradleException("${townsteadApiJar.name} carries entries outside api/v1: ${foreign.take(10)}")
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('verifyTownsteadApi')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mca_version_range      : mca_version_range,
            mcaquests_version_range: mcaquests_version_range,
            townstead_version_range: townstead_version_range,
            recruits_version_range : recruits_version_range,
            recruitsvillages_version_range: recruitsvillages_version_range,
            waystones_version_range: waystones_version_range,
            balm_version_range     : balm_version_range,
            mcacrime_version_range : mcacrime_version_range,
            mcareputation_version_range: mcareputation_version_range,
            politics_townstead_version: politics_townstead_version,
            townstead_validated_tuples: townstead_validated_tuples,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'mcakingdoms-politics.properties']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'MixinConfigs'             : 'mcakingdoms.mixins.json',
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('apiJar', Jar) {
    dependsOn tasks.named('compileJava')
    archiveClassifier = 'api'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output.classesDirs) {
        include 'dev/otectus/mcakingdoms/api/**'
        exclude 'dev/otectus/mcakingdoms/api/ApiBootstrap.class'
    }

    manifest {
        attributes([
                'Specification-Title'  : "${mod_id}-api",
                'Specification-Version': mod_version,
                'Implementation-Title' : "${mod_id}-api",
        ])
    }
}

tasks.register('verifyApiJar') {
    dependsOn tasks.named('apiJar')
    doLast {
        def jarFile = tasks.named('apiJar').get().archiveFile.get().asFile
        def entries = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry -> entries << entry.name }
        }

        if (!entries.any { it.startsWith('dev/otectus/mcakingdoms/api/') && it.endsWith('.class') }) {
            throw new GradleException("${jarFile.name} contains no public API classes")
        }

        def nonApiClasses = entries.findAll {
            it.endsWith('.class') && !it.startsWith('dev/otectus/mcakingdoms/api/')
        }
        if (!nonApiClasses.isEmpty()) {
            throw new GradleException("${jarFile.name} contains implementation classes: ${nonApiClasses.take(20)}")
        }

        def resources = entries.findAll {
            it.endsWith('.json') || it.endsWith('.toml') || it.endsWith('.mcmeta')
        }
        if (!resources.isEmpty()) {
            throw new GradleException("${jarFile.name} must be classes only: ${resources.take(20)}")
        }

        def forbiddenReferences = ['dev/otectus/mcakingdoms/core/', 'dev/otectus/mcakingdoms/client/',
                                   'dev/otectus/mcakingdoms/compat/', 'forge/net/mca/', 'com/aetherianartificer/']
        def linking = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    def constants = new String(zip.getInputStream(entry).bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (forbiddenReferences.any { constants.contains(it) }) linking << entry.name
                }
            }
        }
        if (!linking.isEmpty()) {
            throw new GradleException("${jarFile.name} API classes reference implementation/client/MCA classes: ${linking.take(20)}")
        }
    }
}

artifacts {
    archives tasks.named('apiJar')
}

tasks.named('assemble').configure {
    dependsOn tasks.named('apiJar')
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyApiJar')
}

// The addon example (examples/addon) compiles against the API jar and Forge alone, as a real addon does, so
// `check` fails if the example or the API contract it shows drifts.
sourceSets {
    addonExample {
        java.setSrcDirs(['examples/addon/src/main/java'])
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.compileClasspath + files(tasks.named('apiJar').flatMap { it.archiveFile })
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('compileAddonExampleJava')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
