org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,48)
loader_version_range=[47,48)
mapping_channel=official
mapping_version=1.20.1

# Optional integration runtime
mca_version=7.6.26+1.20.1
mca_version_range=[7.6,8)
mcaquests_version_range=[1.6.5,)
townstead_version_range=[0.7.6,0.9)
# Every optional companion range is a lower bound only: Forge enforces an optional range when the mod is
# present, every one of these bridges already fails closed on API drift, and refusing to launch over an
# optional integration is worse than running without it. Townstead's 0.9 bound matches MCA: Quests (0.8
# adds api.v1; 0.9 has not been seen). Recruits is audited for exactly 1.15.2, but that is enforced at
# runtime, not here: RecruitsMixinPlugin applies the Recruits mixins only to 1.15.2, and every adapter
# (RecruitsEvents, RecruitsMilitary, RecruitsObservation) refuses any other version, so a newer Recruits
# launches with the integration off and one warning in the log. ModsTomlRangesTest keeps this rule.
recruits_version_range=[1.15.2,)
# Recruits: Living Villages is audited for exactly 1.1.0, enforced at runtime like Recruits: LvGate applies the Living
# Villages hooks only to the 1.1.0 release jar (by SHA-256) with Recruits 1.15.2; any other build launches with the
# integration off, its saved bridge records kept read-only, and the reason in Server health.
recruitsvillages_version_range=[1.1.0,)
# Waystones settlement names (WAY-01) are tested with Waystones 14.1.21 and Balm 7.3.44 and enforced at runtime, like Recruits:
# WaystonesIntegration names stones only with exactly that pair, and the edit observer (WaystonesEditMixin) applies only to the
# 14.1.21 jar by SHA-256. These ranges are load-compatibility lower bounds, not support claims: any other version launches
# with the integration reporting itself unsupported and every waystone keeping Waystones' own names.
waystones_version_range=[14.1.21,)
balm_version_range=[7.3.44,)
mcacrime_version_range=[0.7.5,)
mcareputation_version_range=[0.6.0,)
politics_townstead_version=0.7.6+1.20.1,0.8.0+1.20.1
# Townstead api.v1 (compat/townstead/v1): the compile-only jar in libs/townstead-api is the api/v1 package of the 0.8.0
# release tag, compiled under this project's official mappings and pinned here; TownsteadApiContractTest checks every
# member this mod links against in the published jar (Modrinth b8VnGFDu, SHA-1 below). See build.gradle.
townstead_api_version=0.8.0+1.20.1
townstead_api_source_commit=c0c1634c498c0cba192bd1391d1141880c8223fb
townstead_published_sha1=b64727e8076259a697187662963c54e39dc5827d
townstead_api_jar_sha256=7e5d0ee26d19a67110acdd361aa29a9d71ea573cab776a8cc47c545d590d10e7
# Townstead@MCA pairs that passed the packaged acceptance phases (docs/compatibility-certified.md); reported, never gated.
townstead_validated_tuples=0.7.6+1.20.1@7.6.26+1.20.1,0.8.0+1.20.1@7.7.1-beta.5+1.20.1

