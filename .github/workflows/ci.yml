# Core checks for MCA: Kingdoms (H04). Everything here needs only Java 17, Python 3 and the Gradle wrapper; full-pack,
# client and multiplayer suites need licensed or local artifacts and run locally (docs/Testing.md).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, API isolation and add-on example
        run: ./gradlew --no-daemon check build
      - name: Resource, language and keyed-message validation
        run: python3 -I tools/test/validate_resources.py
      - name: Release artifacts carry no test content or optional dependencies
        run: python3 -I tools/test/verify_artifacts.py
      - name: Keep reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports
  gametests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: GameTests on a fresh world
        run: python3 tools/test/run_gametests.py
      - name: Keep the GameTest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            build/test-logs
            run/logs
  dedicated-server-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The packaged server needs the Minecraft EULA accepted. Set the repository variable MCAKINGDOMS_ACCEPT_EULA to
    # true only if you accept https://aka.ms/MinecraftEULA; without it this job reports SKIPPED, never passed.
    env:
      MCAKINGDOMS_ACCEPT_EULA: ${{ vars.MCAKINGDOMS_ACCEPT_EULA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod and the acceptance fixture
        run: ./gradlew --no-daemon build productionTestJar -I tools/test/production-tests.gradle
      - name: Install the Forge dedicated server
        run: python3 -I tools/test/forge_server.py
      - name: Packaged politics boots (fresh world, restart, future schema)
        run: |
          if [ "${MCAKINGDOMS_ACCEPT_EULA}" != "true" ]; then echo "SKIPPED: dedicated-server smoke: MCAKINGDOMS_ACCEPT_EULA is not set"; exit 0; fi
          python3 tools/test/integration_runtime.py --work-dir build/ci-smoke --phase politics
